name: build-and-deploy
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact for GitHub Pages
        # use the Pages-specific artifact action (not the deprecated upload-artifact@v3)
        uses: actions/upload-pages-artifact@v1
        with:
          path: '.'   # change to './docs' or './public' if your static files live there

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1