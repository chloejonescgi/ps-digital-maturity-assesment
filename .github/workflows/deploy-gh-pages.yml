name: Deploy static site to gh-pages
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build site directory
        run: |
          # create a clean site/ folder with only the files you want published
          rm -rf site
          mkdir site
          # copy files (exclude Git metadata and workflow files)
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' ./ site/

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site